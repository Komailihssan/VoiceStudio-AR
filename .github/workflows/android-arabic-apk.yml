name: Build VoiceStudio Arabic Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/native/android/**'
      - 'mobile/native/pins.json'
      - 'mobile/contract/models.json'
      - '.github/workflows/android-arabic-apk.yml'

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: '27.1.12297006'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: |
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          yes | sdkmanager --licenses >/dev/null
          echo "$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Python and native build tools
        run: |
          python3 --version
          cmake --version
          ninja --version

      - name: Prepare pinned native Android runtimes
        run: bash mobile/native/android/build.sh

      - name: Assemble debug APK
        working-directory: mobile/android
        run: |
          for attempt in 1 2 3; do
            bash ./gradlew :app:assembleDebug --no-daemon && exit 0
            echo "Assemble failed (attempt $attempt); retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-0.5.8-Arabic-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android unit tests
        working-directory: mobile/android
        # Maven Central sometimes answers 429 while Robolectric downloads its Android jar;
        # retry so a network hiccup does not fail the build.
        run: |
          for attempt in 1 2 3; do
            bash ./gradlew :features:testDebugUnitTest :app:testDebugUnitTest --no-daemon && exit 0
            echo "Unit tests failed (attempt $attempt); retrying in 60s"
            sleep 60
          done
          exit 1
